# davidfinch — BIST100 paper trade botu ayarları
# Gizli bilgiler (API anahtarları, token'lar) burada DEĞİL, .env dosyasında durur.

timezone: Europe/Istanbul
db_path: data/davidfinch.db
universe_file: data/bist100.txt

data:
  source: yahoo            # ileride: matriks
  history_days: 400        # canlı çalışmada tutulan geçmiş (200g ortalama için yeterli)
  benchmark: XU100         # kıyaslama endeksi

risk:                      # SABİT KURALLAR — bot bunları asla kendisi değiştiremez
  initial_capital: 100000  # TL
  min_cash_ratio: 0.0      # nakit zorunluluğu yok (kullanıcı kararı)
  max_position_ratio: 0.28 # tek hisse en fazla portföyün %28'i
  risk_per_trade: 0.01     # stop olunursa kayıp en fazla portföyün %1'i
  max_open_positions: 10

costs:
  commission_rate: 0.002   # binde 2 (temkinli varsayım; kurumun oranını öğrenince güncelle)
  bsmv_rate: 0.05          # komisyon üzerinden %5 BSMV
  slippage_rate: 0.001     # alımda +%0.1, satımda -%0.1 kayma

strategy:
  active: momentum         # momentum | pullback
  sizing: equal_weight     # equal_weight | risk  (bkz. README)

  momentum:                # ÖĞRENİLEN PARAMETRELER — başlangıç değerleri
    lookback: 126          # momentum penceresi (gün); izinli: 63, 126, 252
    skip_days: 21          # son ~1 ay hariç tutulur
    trend_sma: 200         # uygunluk: kapanış 200g ortalamanın üstünde
    hold_rank: 15          # tutma tamponu; izinli: 10–20
    atr_stop_mult: 3.0     # izinli: 2.0–4.0
    atr_period: 14

  pullback:                # ikincil strateji (şu an pasif)
    trend_sma: 100
    rsi_entry: 40
    atr_stop_mult: 2.5
    volume_mult: 1.2
    atr_period: 14
    rsi_period: 14
